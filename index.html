<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>나의 일기</title>

<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  color:#222;
  background:#f5f5f7
}
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:760px;margin:auto;padding:18px}
.box,.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px
}
h1{font-size:24px}
h2{font-size:18px}
input,textarea,button{font:inherit}
input,textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:9px;
  margin:5px 0 10px
}

.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
button{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  cursor:pointer
}
.primary{background:#222;color:#fff}
.muted{background:#eee}
.danger{background:#fee;color:#900}
.meta{
  font-size:12px;

}

.body{

.empty{text-align:center;color:#888;padding:24px}
.status{font-size:13px;margin:8px 0}

</style>
</head>

<body>

<div id="lock" class="wrap lock">
  <div class="box">
    <h1>🔒 나의 일기</h1>
    <p class="notice">이 일기는 이 기기에 암호화되어 저장됩니다.</p>

    <input id="pw" type="password" placeholder="비밀번호">

    <button id="unlock" class="primary" style="width:100%">
      열기
    </button>

    <div id="lockMsg" class="notice"></div>
  </div>
</div>


<div id="app" class="wrap hidden">

  <h1>📔 나의 일기</h1>

  <div id="saveStatus" class="status ok">
    이 iPhone에 저장
  </div>


  <div class="box">

    <div class="row">
      <input id="date" type="date">
      <input id="title" placeholder="제목">
    </div>

    <textarea id="content" placeholder="오늘의 기록"></textarea>

    <input id="files" type="file" multiple>

    <div id="fileInfo" class="notice"></div>

    <button id="save" class="primary" style="width:100%;margin-top:8px">
      일기 저장
    </button>

  </div>


  <div class="box">

    <h2>검색</h2>

    <div class="row">
      <input id="q" placeholder="제목/내용 검색">
      <input id="searchDate" type="date">
    </div>

    <div class="row">
      <button id="reset" class="muted">검색 초기화</button>
      <button id="toggleHidden" class="muted">숨긴 일기 보기</button>
    </div>

    <div id="count" class="notice"></div>

  </div>


  <div class="box">

    <h2>백업</h2>

    <div class="row">
      <button id="word" class="muted">Word 백업</button>
      <button id="excel" class="muted">Excel 백업</button>
    </div>

    <p class="notice">
      휴대폰을 바꾸거나 앱 데이터를 삭제하기 전에 백업해 주세요.
    </p>

  </div>


  <h2 id="listTitle">전체 일기</h2>

  <div id="list"></div>

</div>


<script>
'use strict';

/* =====================================
   저장소 이름

   기존 버전과 같은 이름을 사용해서
   기존 일기를 그대로 불러온다.
===================================== */

const AUTH = 'diary_v4_auth';
const DATA = 'diary_v4_data';


let password = '';
let showHidden = false;
let editId = null;


const $ = id => document.getElementById(id);

const enc = new TextEncoder();
const dec = new TextDecoder();


/* =====================================
   Base64
===================================== */

function b64(u){

  let s = '';

  const a = new Uint8Array(u);

  for(let i=0;i<a.length;i+=0x8000){

    s += String.fromCharCode(
      ...a.subarray(i,i+0x8000)
    );

  }

  return btoa(s);

}


function unb64(s){

  return Uint8Array.from(
    atob(s),
    c=>c.charCodeAt(0)
  );

}


/* =====================================
   SHA256
===================================== */

async function sha(s){

  return b64(
    await crypto.subtle.digest(
      'SHA-256',
      enc.encode(s)
    )
  );

}


/* =====================================
   암호화 키 생성
===================================== */

async function keyFor(p,s){

  const k = await crypto.subtle.importKey(
    'raw',
    enc.encode(p),
    'PBKDF2',
    false,
    ['deriveKey']
  );


  return crypto.subtle.deriveKey(
    {
      name:'PBKDF2',
      salt:s,
      iterations:250000,
      hash:'SHA-256'
    },
    k,
    {
      name:'AES-GCM',
      length:256
    },
    false,
    ['encrypt','decrypt']
  );

}


/* =====================================
   암호화
===================================== */

async function seal(value){

  const salt =
    crypto.getRandomValues(
      new Uint8Array(16)
    );


  const iv =
    crypto.getRandomValues(
      new Uint8Array(12)
    );


  const key =
    await keyFor(
      password,
      salt
    );


  const encrypted =
    await crypto.subtle.encrypt(
      {
        name:'AES-GCM',
        iv
      },
      key,
      enc.encode(
        JSON.stringify(value)
      )
    );


  return JSON.stringify({
    s:b64(salt),
    i:b64(iv),
    d:b64(encrypted)
  });

}


/* =====================================
   복호화
===================================== */

async function openSeal(raw){

  const o = JSON.parse(raw);

  if(
    !o ||
    !o.s ||
    !o.i ||
    !o.d
  ){
    throw new Error(
      '올바르지 않은 일기 데이터입니다.'
    );
  }


  const salt = unb64(o.s);
  const iv = unb64(o.i);


  const key =
    await keyFor(
      password,
      salt
    );


  const plain =
    await crypto.subtle.decrypt(
      {
        name:'AES-GCM',
        iv
      },
      key,
      unb64(o.d)
    );


  return JSON.parse(
    dec.decode(plain)
  );

}


/* =====================================
   로컬 일기 불러오기
===================================== */

async function loadLocal(){

  const raw =
    localStorage.getItem(DATA);


  if(!raw){
    return [];
  }


  const data =
    await openSeal(raw);


  return Array.isArray(data)
    ? data
    : [];

}


/* =====================================
   로컬 일기 저장
===================================== */

async function saveLocal(a){

  const encrypted =
    await seal(a);


  localStorage.setItem(
    DATA,
    encrypted
  );

}


/* =====================================
   날짜
===================================== */

function today(){

  const d = new Date();


  return (
    d.getFullYear()
    + '-'
    + String(
        d.getMonth()+1
      ).padStart(2,'0')
    + '-'
    + String(
        d.getDate()
      ).padStart(2,'0')
  );

}


/* =====================================
   저장 시간
===================================== */

function tm(t){

  const d = new Date(t);


  return (
    String(
      d.getHours()
    ).padStart(2,'0')
    + ':'
    + String(
      d.getMinutes()
    ).padStart(2,'0')
  );

}


/* =====================================
   HTML 안전 처리
===================================== */

function esc(s=''){

  return String(s).replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}


/* =====================================
   상태 표시
===================================== */

function status(msg,ok=true){

  const el = $('saveStatus');

  el.className =
    'status ' + (ok?'ok':'err');

  el.textContent = msg;

}


/* =====================================
   파일 → Base64

   첨부파일도 서버 없이
   암호화된 일기 데이터 안에 저장한다.
===================================== */

function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onload = ()=>{

        try{

          const result =
            String(reader.result || '');


          const pos =
            result.indexOf(',');


          resolve({
            id:crypto.randomUUID(),
            name:file.name,
            type:
              file.type ||
              'application/octet-stream',
            size:file.size,
            data:
              pos>=0
              ? result.slice(pos+1)
              : ''
          });

        }
        catch(e){

          reject(e);

        }

      };


      reader.onerror = ()=>{

        reject(
          new Error(
            '파일을 읽지 못했습니다.'
          )
        );

      };


      reader.readAsDataURL(file);

    }
  );

}


/* =====================================
   잠금 해제
===================================== */

async function unlock(){

  $('lockMsg').textContent = '';


  try{

    const p =
      $('pw').value;


    if(!p){

      alert(
        '비밀번호를 입력하세요.'
      );

      return;

    }


    const h =
      await sha(
        'DIARY-V4|' + p
      );


    const saved =
      localStorage.getItem(AUTH);


    /*
      이 기기에 이미 비밀번호가
      설정되어 있는 경우
    */

    if(
      saved &&
      saved !== h
    ){

      alert(
        '비밀번호가 다릅니다.'
      );

      return;

    }


    password = p;


    /*
      기존 일기가 있으면 먼저
      실제 복호화가 되는지 확인한다.
    */

    if(
      localStorage.getItem(DATA)
    ){

      await loadLocal();

    }
    else{

      /*
        완전히 처음 사용하는 경우
      */

      await saveLocal([]);

    }


    /*
      데이터 확인이 끝난 뒤에만
      비밀번호 정보를 저장한다.
    */

    if(!saved){

      localStorage.setItem(
        AUTH,
        h
      );

    }


    $('lock').classList.add(
      'hidden'
    );


    $('app').classList.remove(
      'hidden'
    );


    $('date').value =
      today();


    await render();


    status(
      '✓ 이 iPhone에 안전하게 저장됩니다'
    );

  }
  catch(e){

    console.error(e);


    password = '';


    $('lockMsg').textContent =
      '비밀번호가 다르거나 기존 일기 데이터를 열 수 없습니다.';

  }

}


/* =====================================
   일기 저장
===================================== */

async function save(){

  try{

    const date =
      $('date').value;


    const title =
      $('title').value.trim();


    const content =
      $('content').value.trim();


    if(
      !date ||
      (!title && !content)
    ){

      alert(
        '날짜와 일기 내용을 입력하세요.'
      );

      return;

    }


    let diaries =
      await loadLocal();


    const now =
      Date.now();


    let diary;


    /* =================================
       기존 일기 수정
    ================================= */

    if(editId){

      const i =
        diaries.findIndex(
          x=>x.id===editId
        );


      if(i<0){

        alert(
          '수정할 일기를 찾지 못했습니다.'
        );

        return;

      }


      /*
        기존 규칙 유지:
        오늘 작성한 일기만 수정 가능
      */

      if(
        diaries[i].date !== today()
      ){

        alert(
          '지난 날짜의 일기는 수정할 수 없습니다.'
        );

        return;

      }


      diary = {
        ...diaries[i],
        title,
        content,
        updated:now
      };


      const files =
        Array.from(
          $('files').files || []
        );


      if(files.length){

        status(
          '첨부파일 저장 중…'
        );

      }


      const added = [];


      for(const file of files){

        try{

          added.push(
            await fileToBase64(file)
          );

        }
        catch(e){

          console.error(e);

          alert(
            `"${file.name}" 파일을 저장하지 못했습니다.`
          );

        }

      }


      diary.attachments = [
        ...(diary.attachments || []),
        ...added
      ];


      diaries[i] = diary;

    }

    /* =================================
       새 일기
    ================================= */

    else{

      /*
        같은 날짜에는
        하나의 일기만 저장
      */

      if(
        diaries.some(
          x=>x.date===date
        )
      ){

        alert(
          '해당 날짜에 이미 저장된 일기가 있습니다.'
        );

        return;

      }


      diary = {
        id:crypto.randomUUID(),
        date,
        title,
        content,
        created:now,
        updated:now,
        hidden:false,
        attachments:[]
      };


      const files =
        Array.from(
          $('files').files || []
        );


      if(files.length){

        status(
          '첨부파일 저장 중…'
        );

      }


      for(const file of files){

        try{

          diary.attachments.push(
            await fileToBase64(file)
          );

        }
        catch(e){

          console.error(e);

          alert(
            `"${file.name}" 파일을 저장하지 못했습니다.`
          );

        }

      }


      diaries.unshift(diary);

    }


    /*
      서버 호출 없음.
      이 기기의 localStorage에만 저장.
    */

    await saveLocal(diaries);


    clearForm();


    await render();


    status(
      '✓ 저장 완료'
    );

  }
  catch(e){

    console.error(e);


    if(
      e &&
      (
        e.name==='QuotaExceededError' ||
        /quota/i.test(
          e.message || ''
        )
      )
    ){

      alert(
        '휴대폰 저장공간 한도를 초과했습니다. 큰 첨부파일을 줄이거나 백업해 주세요.'
      );

    }
    else{

      alert(
        '일기를 저장하지 못했습니다.'
      );

    }


    status(
      '저장 실패',
      false
    );

  }

}


/* =====================================
   입력창 초기화
===================================== */

function clearForm(){

  $('date').value =
    today();

  $('title').value = '';

  $('content').value = '';

  $('files').value = '';

  $('fileInfo').textContent = '';

  editId = null;

  $('save').textContent =
    '일기 저장';

}


/* =====================================
   첨부파일 다운로드
===================================== */

async function downloadAttachment(id){

  try{

    const diaries =
      await loadLocal();


    let attachment = null;


    for(const diary of diaries){

      attachment =
        (diary.attachments || [])
        .find(
          a=>a.id===id
        );


      if(attachment){
        break;
      }

    }


    if(!attachment){

      alert(
        '첨부파일을 찾을 수 없습니다.'
      );

      return;

    }


    /*
      새 로컬 방식의 첨부파일
    */

    if(attachment.data){

      const bytes =
        unb64(
          attachment.data
        );


      const blob =
        new Blob(
          [bytes],
          {
            type:
              attachment.type ||
              'application/octet-stream'
          }
        );


      const url =
        URL.createObjectURL(blob);


      const a =
        document.createElement('a');


      a.href = url;

      a.download =
        attachment.name ||
        '첨부파일';


      document.body.appendChild(a);

      a.click();

      a.remove();


      setTimeout(
        ()=>URL.revokeObjectURL(url),
        1500
      );


      return;

    }


    /*
      예전 Supabase 첨부파일은
      서버가 없으므로 자동 다운로드 불가.
      앱 자체 오류는 발생시키지 않는다.
    */

    alert(
      '이 파일은 이전 클라우드 버전에서 저장된 첨부파일입니다.'
    );

  }
  catch(e){

    console.error(e);

    alert(
      '첨부파일을 열지 못했습니다.'
    );

  }

}


/* =====================================
   화면 출력
===================================== */

async function render(){

  let diaries =
    await loadLocal();


  const q =
    $('q')
    .value
    .trim()
    .toLowerCase();


  const searchDate =
    $('searchDate').value;


  diaries =
    diaries

    .filter(
      x=>
        showHidden
        ? x.hidden
        : !x.hidden
    )

    .filter(
      x=>{

        const text =
          (
            (x.title || '') +
            ' ' +
            (x.content || '')
          )
          .toLowerCase();


        return (
          (!q || text.includes(q))
          &&
          (
            !searchDate ||
            x.date===searchDate
          )
        );

      }
    )

    .sort(
      (a,b)=>
        b.date.localeCompare(
          a.date
        )
    );


  $('count').textContent =
    `${diaries.length}개의 일기`;


  $('listTitle').textContent =
    showHidden
    ? '숨긴 일기'
    : '전체 일기';


  $('toggleHidden').textContent =
    showHidden
    ? '전체 일기 보기'
    : '숨긴 일기 보기';


  $('list').innerHTML =
    diaries.length
    ? ''
    : '<div class="box empty">저장된 일기가 없습니다.</div>';


  for(const x of diaries){

    const d =
      document.createElement(
        'div'
      );


    d.className =
      'card';


    const attachments =
      (x.attachments || [])
      .map(
        f=>
          `<div class="attach">
            <button class="muted" data-file="${esc(f.id)}">
              📎 ${esc(f.name || '첨부파일')}
            </button>
          </div>`
      )
      .join('');


    d.innerHTML = `

      <div class="title">
        ${esc(x.title || '(제목 없음)')}
      </div>

      <div class="body">
        ${esc(x.content || '')}
      </div>

      ${attachments}

      <div class="actions">

        ${
          x.date===today()
          ?
          `<button
             data-act="edit"
             data-id="${esc(x.id)}"
             class="muted">
             수정
           </button>`
          :
          ''
        }

        <button
          data-act="hide"
          data-id="${esc(x.id)}"
          class="muted">

          ${
            x.hidden
            ? '숨김 해제'
            : '숨기기'
          }

        </button>

        <button
          data-act="del"
          data-id="${esc(x.id)}"
          class="danger">
          삭제
        </button>

      </div>

      <div class="meta">
        ${esc(x.date)} · 저장 ${tm(x.updated || x.created)}
      </div>

    `;


    $('list').appendChild(d);

  }

}


/* =====================================
   수정 / 숨김 / 삭제
===================================== */

async function action(e){

  const fileButton =
    e.target.closest(
      'button[data-file]'
    );


  if(fileButton){

    await downloadAttachment(
      fileButton.dataset.file
    );

    return;

  }


  const button =
    e.target.closest(
      'button[data-act]'
    );


  if(!button){
    return;
  }


  try{

    let diaries =
      await loadLocal();


    const i =
      diaries.findIndex(
        x=>x.id===button.dataset.id
      );


    if(i<0){
      return;
    }


    let diary =
      diaries[i];


    /* 수정 */

    if(
      button.dataset.act==='edit'
    ){

      $('date').value =
        diary.date;

      $('title').value =
        diary.title || '';

      $('content').value =
        diary.content || '';

      editId =
        diary.id;


      $('fileInfo').textContent =
        (diary.attachments || []).length
        ?
        `기존 첨부 ${(diary.attachments || []).length}개 · 새 파일 추가 가능`
        :
        '';


      $('save').textContent =
        '수정 저장';


      window.scrollTo({
        top:0,
        behavior:'smooth'
      });


      return;

    }


    /* 숨김 */

    if(
      button.dataset.act==='hide'
    ){

      diary = {
        ...diary,
        hidden:!diary.hidden,
        updated:Date.now()
      };


      diaries[i] =
        diary;


      await saveLocal(diaries);

      await render();


      status(
        '✓ 변경사항 저장 완료'
      );


      return;

    }


    /* 삭제 */

    if(
      button.dataset.act==='del'
    ){

      if(
        !confirm(
          '이 일기를 삭제할까요?'
        )
      ){
        return;
      }


      diaries.splice(
        i,
        1
      );


      await saveLocal(diaries);


      if(editId===diary.id){

        clearForm();

      }


      await render();


      status(
        '✓ 삭제 완료'
      );

    }

  }
  catch(e){

    console.error(e);

    alert(
      '처리 중 오류가 발생했습니다.'
    );

  }

}


/* =====================================
   다운로드 공통
===================================== */

function dl(blob,name){

  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement('a');


  a.href =
    url;


  a.download =
    name;


  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1500
  );

}


/* =====================================
   Word 백업
===================================== */

async function word(){

  try{

    const diaries =
      await loadLocal();


    const html =
      '<html><meta charset="utf-8"><body>' +
      '<h1>나의 일기</h1>' +

      diaries

      .filter(
        x=>!x.hidden
      )

      .sort(
        (a,b)=>
          a.date.localeCompare(
            b.date
          )
      )

      .map(
        x=>
          `<h2>${esc(x.date)} ${esc(x.title || '')}</h2>
           <p>${esc(x.content || '').replace(/\n/g,'<br>')}</p>
           <p>${esc(x.date)} · 저장 ${tm(x.updated || x.created)}</p>`
      )

      .join('') +

      '</body></html>';


    dl(
      new Blob(
        [html],
        {
          type:'application/msword'
        }
      ),
      '나의_일기.doc'
    );

  }
  catch(e){

    console.error(e);

    alert(
      'Word 백업을 만들지 못했습니다.'
    );

  }

}


/* =====================================
   Excel(CSV) 백업
===================================== */

async function excel(){

  try{

    const diaries =
      await loadLocal();


    const rows = [

      [
        '날짜',
        '제목',
        '내용',
        '저장시간'
      ],

      ...diaries

      .filter(
        x=>!x.hidden
      )

      .sort(
        (a,b)=>
          a.date.localeCompare(
            b.date
          )
      )

      .map(
        x=>[
          x.date,
          x.title || '',
          x.content || '',
          tm(x.updated || x.created)
        ]
      )

    ];


    const csv =
      '\ufeff' +

      rows

      .map(
        row=>
          row
          .map(
            value=>
              '"' +
              String(value ?? '')
              .replace(
                /"/g,
                '""'
              )
              +
              '"'
          )
          .join(',')
      )

      .join('\n');


    dl(
      new Blob(
        [csv],
        {
          type:'text/csv;charset=utf-8'
        }
      ),
      '나의_일기.csv'
    );

  }
  catch(e){

    console.error(e);

    alert(
      'Excel 백업을 만들지 못했습니다.'
    );

  }

}
