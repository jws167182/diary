<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>나의 일기</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#222;background:#f5f5f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px}.box,.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}h1{font-size:24px}h2{font-size:18px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:5px 0 10px}textarea{min-height:180px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer}.primary{background:#222;color:#fff}.muted{background:#eee}.danger{background:#fee;color:#900}.meta{font-size:12px;color:#777;text-align:right;margin-top:10px}.title{font-weight:700;font-size:17px}.body{white-space:pre-wrap;margin:9px 0;line-height:1.55}.actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.notice,.attach{font-size:13px;color:#666}.lock{max-width:420px;margin:70px auto}.empty{text-align:center;color:#888;padding:24px}.status{font-size:13px;margin:8px 0}.ok{color:#087b38}.err{color:#a00}
</style></head><body>
<div id="lock" class="wrap lock"><div class="box"><h1>🔒 나의 일기</h1><p class="notice">PC와 휴대폰에서 같은 비밀번호를 사용하세요.</p><input id="pw" type="password" placeholder="비밀번호"><button id="unlock" class="primary" style="width:100%">열기</button><div id="lockMsg" class="notice"></div></div></div>
<div id="app" class="wrap hidden"><h1>📔 나의 일기</h1><div id="cloudStatus" class="status">동기화 준비 중</div>
<div class="box"><div class="row"><input id="date" type="date"><input id="title" placeholder="제목"></div><textarea id="content" placeholder="오늘의 기록"></textarea><input id="files" type="file" multiple><div id="fileInfo" class="notice"></div><button id="save" class="primary" style="width:100%;margin-top:8px">일기 저장</button></div>
<div class="box"><h2>검색</h2><div class="row"><input id="q" placeholder="제목/내용 검색"><input id="searchDate" type="date"></div><div class="row"><button id="reset" class="muted">검색 초기화</button><button id="toggleHidden" class="muted">숨긴 일기 보기</button><button id="syncNow" class="muted">지금 동기화</button></div><div id="count" class="notice"></div></div>
<div class="box"><h2>백업</h2><div class="row"><button id="word" class="muted">Word 백업</button><button id="excel" class="muted">Excel 백업</button></div></div>
<h2 id="listTitle">전체 일기</h2><div id="list"></div></div>
<script>
'use strict';
const SB_URL='https://ocovlzoijitowpipxphr.supabase.co';
const SB_KEY='sb_publishable_kvOpsuEQP4TjqACKote4Uw_wbl1I4ri';
const AUTH='diary_v4_auth', DATA='diary_v4_data';
let password='', showHidden=false, editId=null, syncing=false;
const $=id=>document.getElementById(id), enc=new TextEncoder(), dec=new TextDecoder();
const b64=u=>{let s='',a=new Uint8Array(u);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode(...a.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(s){return b64(await crypto.subtle.digest('SHA-256',enc.encode(s)))}
async function keyFor(p,s){const k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(value){const s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await keyFor(password,s),d=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(value)));return JSON.stringify({s:b64(s),i:b64(iv),d:b64(d)})}
async function openSeal(raw){const o=JSON.parse(raw),s=unb64(o.s),iv=unb64(o.i),k=await keyFor(password,s),p=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,unb64(o.d));return JSON.parse(dec.decode(p))}
async function loadLocal(){const raw=localStorage.getItem(DATA);return raw?openSeal(raw):[]}
async function saveLocal(a){localStorage.setItem(DATA,await seal(a))}
function headers(extra={}){return {apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,...extra}}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function tm(t){const d=new Date(t);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(msg,ok=true){$('cloudStatus').className='status '+(ok?'ok':'err');$('cloudStatus').textContent=msg}
async function cloudRows(){const r=await fetch(`${SB_URL}/rest/v1/diaries?select=id,encrypted_data,updated_at`,{headers:headers()});if(!r.ok)throw Error(`DB 읽기 실패 (${r.status})`);return r.json()}
async function cloudUpsert(d){const encrypted_data=await seal(d),r=await fetch(`${SB_URL}/rest/v1/diaries?on_conflict=id`,{method:'POST',headers:headers({'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({id:d.id,encrypted_data,updated_at:new Date(d.updated||Date.now()).toISOString()})});if(!r.ok)throw Error(`DB 저장 실패 (${r.status}) ${await r.text()}`)}
async function cloudDelete(id){const r=await fetch(`${SB_URL}/rest/v1/diaries?id=eq.${encodeURIComponent(id)}`,{method:'DELETE',headers:headers()});if(!r.ok)throw Error(`DB 삭제 실패 (${r.status})`)}
async function uploadAttachment(diaryId,file){const aid=crypto.randomUUID(),path=`${diaryId}/${aid}`,bytes=new Uint8Array(await file.arrayBuffer()),payload=await seal({name:file.name,type:file.type||'application/octet-stream',size:file.size,data:b64(bytes)}),r=await fetch(`${SB_URL}/storage/v1/object/diary-files/${path}`,{method:'POST',headers:headers({'Content-Type':'application/json','x-upsert':'true'}),body:payload});if(!r.ok)throw Error(`첨부 저장 실패 (${r.status}) ${await r.text()}`);return {id:aid,path,name:file.name,size:file.size}}
async function getAttachment(a){const r=await fetch(`${SB_URL}/storage/v1/object/diary-files/${a.path}`,{headers:headers()});if(!r.ok)throw Error(`첨부 읽기 실패 (${r.status})`);return openSeal(await r.text())}
async function removeAttachments(d){for(const a of d.attachments||[]){try{await fetch(`${SB_URL}/storage/v1/object/diary-files/${a.path}`,{method:'DELETE',headers:headers()})}catch(_){}}}
async function syncAll(){if(syncing)return;syncing=true;status('동기화 중…');try{let local=await loadLocal(),rows=await cloudRows(),remote=[];for(const row of rows){try{const d=await openSeal(row.encrypted_data);if(d&&d.id)remote.push(d)}catch(_){}}
const byId=new Map();for(const d of [...local,...remote]){const old=byId.get(d.id);if(!old||(d.updated||0)>(old.updated||0))byId.set(d.id,d)}let merged=[...byId.values()];
const byDate=new Map();for(const d of merged){const old=byDate.get(d.date);if(!old||(d.updated||0)>(old.updated||0))byDate.set(d.date,d)}merged=[...byDate.values()];await saveLocal(merged);
const remoteIds=new Set(remote.map(x=>x.id));for(const d of merged)if(!remoteIds.has(d.id)||!remote.some(r=>r.id===d.id&&(r.updated||0)>=(d.updated||0)))await cloudUpsert(d);
await render();status('✓ PC ↔ 휴대폰 동기화 완료');}catch(e){console.error(e);status('동기화 실패: '+(e.message||e),false)}finally{syncing=false}}
async function unlock(){try{const p=$('pw').value;if(!p)return alert('비밀번호를 입력하세요.');const h=await sha('DIARY-V4|'+p),saved=localStorage.getItem(AUTH);if(saved&&saved!==h)return alert('이 기기에 설정된 비밀번호와 다릅니다.');password=p;if(!saved)localStorage.setItem(AUTH,h);if(!localStorage.getItem(DATA))await saveLocal([]);await loadLocal();$('lock').classList.add('hidden');$('app').classList.remove('hidden');$('date').value=today();await render();await syncAll()}catch(e){console.error(e);$('lockMsg').textContent='일기 데이터를 열 수 없습니다.'}}
async function save(){try{const date=$('date').value,title=$('title').value.trim(),content=$('content').value.trim();if(!date||(!title&&!content))return alert('날짜와 일기 내용을 입력하세요.');let a=await loadLocal(),now=Date.now(),d;
if(editId){const i=a.findIndex(x=>x.id===editId);if(i<0)return alert('수정할 일기를 찾지 못했습니다.');if(a[i].date!==today())return alert('지난 날짜의 일기는 수정할 수 없습니다.');d={...a[i],title,content,updated:now};const added=[];for(const f of Array.from($('files').files||[]))added.push(await uploadAttachment(d.id,f));d.attachments=[...(d.attachments||[]),...added];a[i]=d}
else{if(a.some(x=>x.date===date))return alert('해당 날짜에 이미 저장된 일기가 있습니다.');d={id:crypto.randomUUID(),date,title,content,created:now,updated:now,hidden:false,attachments:[]};for(const f of Array.from($('files').files||[]))d.attachments.push(await uploadAttachment(d.id,f));a.unshift(d)}
await saveLocal(a);await cloudUpsert(d);clearForm();await render();status('✓ 저장 및 동기화 완료')}catch(e){console.error(e);alert('저장 실패: '+(e.message||e));status('저장 실패',false)}}
function clearForm(){$('date').value=today();$('title').value='';$('content').value='';$('files').value='';$('fileInfo').textContent='';editId=null;$('save').textContent='일기 저장'}
async function downloadAttachment(id){try{const all=await loadLocal(),a=all.flatMap(d=>d.attachments||[]).find(x=>x.id===id);if(!a)return alert('첨부파일 정보를 찾을 수 없습니다.');const o=await getAttachment(a),blob=new Blob([unb64(o.data)],{type:o.type}),u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download=o.name;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(e){console.error(e);alert('첨부파일을 열 수 없습니다: '+(e.message||e))}}
async function render(){let a=await loadLocal(),q=$('q').value.trim().toLowerCase(),sd=$('searchDate').value;a=a.filter(x=>showHidden?x.hidden:!x.hidden).filter(x=>(!q||(x.title+' '+x.content).toLowerCase().includes(q))&&(!sd||x.date===sd)).sort((x,y)=>y.date.localeCompare(x.date));$('count').textContent=`${a.length}개의 일기`;$('listTitle').textContent=showHidden?'숨긴 일기':'전체 일기';$('toggleHidden').textContent=showHidden?'전체 일기 보기':'숨긴 일기 보기';$('list').innerHTML=a.length?'':'<div class="box empty">저장된 일기가 없습니다.</div>';for(const x of a){const d=document.createElement('div');d.className='card';const ats=(x.attachments||[]).map(f=>`<div class="attach"><button class="muted" data-file="${f.id}">📎 ${esc(f.name)}</button></div>`).join('');d.innerHTML=`<div class="title">${esc(x.title||'(제목 없음)')}</div><div class="body">${esc(x.content)}</div>${ats}<div class="actions">${x.date===today()?`<button data-act="edit" data-id="${x.id}" class="muted">수정</button>`:''}<button data-act="hide" data-id="${x.id}" class="muted">${x.hidden?'숨김 해제':'숨기기'}</button><button data-act="del" data-id="${x.id}" class="danger">삭제</button></div><div class="meta">${x.date} · 저장 ${tm(x.updated||x.created)}</div>`;$('list').appendChild(d)}}
async function action(e){const fb=e.target.closest('button[data-file]');if(fb)return downloadAttachment(fb.dataset.file);const b=e.target.closest('button[data-act]');if(!b)return;let a=await loadLocal(),i=a.findIndex(v=>v.id===b.dataset.id);if(i<0)return;let x=a[i];if(b.dataset.act==='edit'){$('date').value=x.date;$('title').value=x.title;$('content').value=x.content;editId=x.id;$('fileInfo').textContent=(x.attachments||[]).length?`기존 첨부 ${(x.attachments||[]).length}개 · 새 파일 추가 가능`:'';$('save').textContent='수정 저장';scrollTo({top:0,behavior:'smooth'});return}try{if(b.dataset.act==='hide'){x={...x,hidden:!x.hidden,updated:Date.now()};a[i]=x;await saveLocal(a);await cloudUpsert(x)}else if(b.dataset.act==='del'){if(!confirm('이 일기를 삭제할까요?'))return;await cloudDelete(x.id);await removeAttachments(x);a.splice(i,1);await saveLocal(a)}await render();status('✓ 동기화 완료')}catch(err){console.error(err);alert('처리 실패: '+(err.message||err))}}
function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function word(){const a=await loadLocal(),h='<html><meta charset="utf-8"><body><h1>나의 일기</h1>'+a.filter(x=>!x.hidden).sort((x,y)=>x.date.localeCompare(y.date)).map(x=>`<h2>${esc(x.date)} ${esc(x.title)}</h2><p>${esc(x.content).replace(/\n/g,'<br>')}</p><p>${x.date} · 저장 ${tm(x.updated||x.created)}</p>`).join('')+'</body></html>';dl(new Blob([h],{type:'application/msword'}),'나의_일기.doc')}
async function excel(){const a=await loadLocal(),r=[['날짜','제목','내용','저장시간'],...a.filter(x=>!x.hidden).map(x=>[x.date,x.title,x.content,tm(x.updated||x.created)])],c='\ufeff'+r.map(z=>z.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');dl(new Blob([c],{type:'text/csv;charset=utf-8'}),'나의_일기.csv')}
$('unlock').onclick=unlock;$('pw').onkeydown=e=>{if(e.key==='Enter')unlock()};$('save').onclick=save;$('q').oninput=render;$('searchDate').onchange=render;$('reset').onclick=()=>{$('q').value='';$('searchDate').value='';render()};$('toggleHidden').onclick=()=>{showHidden=!showHidden;render()};$('syncNow').onclick=syncAll;$('list').onclick=action;$('files').onchange=()=>{$('fileInfo').textContent=`새 첨부 ${$('files').files.length}개`};$('word').onclick=word;$('excel').onclick=excel;
</script></body></html>
