<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>나의 일기</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#222;background:#f5f5f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px}.box,.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}h1{font-size:24px}h2{font-size:18px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:5px 0 10px}textarea{min-height:180px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer}.primary{background:#222;color:#fff}.muted{background:#eee}.danger{background:#fee;color:#900}.meta{font-size:12px;color:#777;text-align:right;margin-top:10px}.title{font-weight:700;font-size:17px}.body{white-space:pre-wrap;margin:9px 0;line-height:1.55}.actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.notice,.attach{font-size:13px;color:#666}.lock{max-width:420px;margin:70px auto}.empty{text-align:center;color:#888;padding:24px}.sync{border-top:1px solid #eee;margin-top:12px;padding-top:12px}.ok{color:#087b38}.err{color:#a00}</style></head><body>
<div id="lock" class="wrap lock"><div class="box"><h1>🔒 나의 일기</h1><p class="notice">처음이면 사용할 비밀번호를 입력하세요.</p><input id="pw" type="password" placeholder="비밀번호"><button id="unlock" class="primary" style="width:100%">열기</button><div id="lockMsg" class="notice"></div></div></div>
<div id="app" class="wrap hidden"><h1>📔 나의 일기</h1>
<div class="box"><div class="row"><input id="date" type="date"><input id="title" placeholder="제목"></div><textarea id="content" placeholder="오늘의 기록"></textarea><input id="files" type="file" multiple><div id="fileInfo" class="notice"></div><button id="save" class="primary" style="width:100%;margin-top:8px">일기 저장</button></div>
<div class="box"><h2>검색</h2><div class="row"><input id="q" placeholder="제목/내용 검색"><input id="searchDate" type="date"></div><div class="row"><button id="reset" class="muted">검색 초기화</button><button id="toggleHidden" class="muted">숨긴 일기 보기</button></div><div id="count" class="notice"></div></div>
<div class="box"><h2>백업</h2><div class="row"><button id="word" class="muted">Word 백업</button><button id="excel" class="muted">Excel 백업</button><button id="browserBackup" class="muted">브라우저 백업</button></div><div id="backupMsg" class="notice"></div>
<div class="sync"><h2>PC ↔ 휴대폰 동기화</h2><p class="notice">Supabase 프로젝트의 URL·Publishable Key와 같은 동기화 코드를 PC와 휴대폰에 입력하면 같은 암호화 백업을 사용합니다.</p><input id="sbUrl" placeholder="Supabase URL (https://....supabase.co)"><input id="sbKey" placeholder="Publishable / anon key"><input id="syncCode" type="password" placeholder="동기화 코드 (두 기기에서 동일)"><div class="row"><button id="saveSync" class="muted">동기화 설정 저장</button><button id="pushSync" class="muted">클라우드에 올리기</button><button id="pullSync" class="muted">클라우드에서 받기</button></div><div id="syncMsg" class="notice"></div></div></div>
<h2 id="listTitle">전체 일기</h2><div id="list"></div></div>
<script>
const AUTH='diary_v3_auth',DATA='diary_v3_data',BROWSER_BACKUP='diary_v3_browser_backup',SYNC='diary_v3_sync',ADB='diary_v3_files';let password='',showHidden=false,editId=null;
const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder();const b64=u=>{let s='',a=new Uint8Array(u),n=0x8000;for(let i=0;i<a.length;i+=n)s+=String.fromCharCode(...a.subarray(i,i+n));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(s){return b64(await crypto.subtle.digest('SHA-256',enc.encode(s)))}async function keyFor(p,s){let k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptObj(o){let s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await keyFor(password,s),d=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(o)));return JSON.stringify({s:b64(s),i:b64(iv),d:b64(d)})}async function decryptObj(raw){if(!raw)return[];let o=JSON.parse(raw),s=unb64(o.s),iv=unb64(o.i),k=await keyFor(password,s),p=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,unb64(o.d));return JSON.parse(dec.decode(p))}
const load=()=>decryptObj(localStorage.getItem(DATA));async function store(a){localStorage.setItem(DATA,await encryptObj(a))}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(ADB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function dbPut(v){let db=await openDB();return new Promise((ok,no)=>{let t=db.transaction('files','readwrite');t.objectStore('files').put(v);t.oncomplete=()=>{db.close();ok()};t.onerror=()=>{db.close();no(t.error)}})}async function dbGet(id){let db=await openDB();return new Promise((ok,no)=>{let r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>{db.close();ok(r.result)};r.onerror=()=>{db.close();no(r.error)}})}async function dbAll(){let db=await openDB();return new Promise((ok,no)=>{let r=db.transaction('files').objectStore('files').getAll();r.onsuccess=()=>{db.close();ok(r.result||[])};r.onerror=()=>{db.close();no(r.error)}})}async function dbClear(){let db=await openDB();return new Promise((ok,no)=>{let t=db.transaction('files','readwrite');t.objectStore('files').clear();t.oncomplete=()=>{db.close();ok()};t.onerror=()=>{db.close();no(t.error)}})}async function dbDelByDiary(id){let all=await dbAll(),db=await openDB();return new Promise((ok,no)=>{let t=db.transaction('files','readwrite'),s=t.objectStore('files');for(const f of all)if(f.diaryId===id)s.delete(f.id);t.oncomplete=()=>{db.close();ok()};t.onerror=()=>{db.close();no(t.error)}})}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function tm(t){let d=new Date(t);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function unlock(){try{let p=$('pw').value;if(!p)return alert('비밀번호를 입력하세요.');let a=localStorage.getItem(AUTH),h=await sha('DIARY-V3|'+p);if(!a){localStorage.setItem(AUTH,h);password=p;await store([])}else if(a!==h)return alert('비밀번호가 틀렸습니다.');else password=p;await load();$('lock').classList.add('hidden');$('app').classList.remove('hidden');$('date').value=today();loadSyncSettings();await render()}catch(e){$('lockMsg').textContent='저장 데이터를 열 수 없습니다.';console.error(e)}}
async function addFiles(diaryId){let refs=[];for(const f of Array.from($('files').files||[])){let id=crypto.randomUUID(),buf=new Uint8Array(await f.arrayBuffer()),sealed=await encryptObj({name:f.name,type:f.type||'application/octet-stream',size:f.size,data:b64(buf)});await dbPut({id,diaryId,sealed});refs.push({id,name:f.name,size:f.size})}return refs}
async function save(){try{let date=$('date').value,title=$('title').value.trim(),content=$('content').value.trim();if(!date||(!title&&!content))return alert('날짜와 일기 내용을 입력하세요.');let a=await load(),now=Date.now();if(editId){let i=a.findIndex(x=>x.id===editId);if(i<0)return alert('수정할 일기를 찾지 못했습니다.');if(a[i].date!==today())return alert('지난 날짜의 일기는 수정할 수 없습니다.');let refs=await addFiles(editId);a[i]={...a[i],title,content,updated:now,attachments:[...(a[i].attachments||[]),...refs]}}else{if(a.some(x=>x.date===date))return alert('해당 날짜에 이미 저장된 일기가 있습니다.');let id=crypto.randomUUID(),refs=await addFiles(id);a.unshift({id,date,title,content,created:now,updated:now,hidden:false,attachments:refs})}await store(a);clearForm();await render()}catch(e){console.error(e);alert('저장 중 오류: '+(e.message||e))}}
function clearForm(){$('date').value=today();$('title').value='';$('content').value='';$('files').value='';$('fileInfo').textContent='';editId=null;$('save').textContent='일기 저장'}
async function downloadAttachment(id){try{let f=await dbGet(id);if(!f)return alert('첨부파일을 찾을 수 없습니다.');let o=await decryptObj(f.sealed),blob=new Blob([unb64(o.data)],{type:o.type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=o.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){alert('첨부파일을 열 수 없습니다.')}}
async function render(){let a=await load(),q=$('q').value.trim().toLowerCase(),sd=$('searchDate').value;a=a.filter(x=>showHidden?x.hidden:!x.hidden).filter(x=>(!q||(x.title+' '+x.content).toLowerCase().includes(q))&&(!sd||x.date===sd)).sort((x,y)=>y.date.localeCompare(x.date));$('count').textContent=`${a.length}개의 일기`;$('listTitle').textContent=showHidden?'숨긴 일기':'전체 일기';$('toggleHidden').textContent=showHidden?'전체 일기 보기':'숨긴 일기 보기';$('list').innerHTML=a.length?'':'<div class="box empty">저장된 일기가 없습니다.</div>';for(const x of a){let d=document.createElement('div');d.className='card';let ats=(x.attachments||[]).map(f=>`<div class="attach"><button class="muted" data-file="${f.id}">📎 ${esc(f.name)}</button></div>`).join('');d.innerHTML=`<div class="title">${esc(x.title||'(제목 없음)')}</div><div class="body">${esc(x.content)}</div>${ats}<div class="actions">${x.date===today()?`<button data-act="edit" data-id="${x.id}" class="muted">수정</button>`:''}<button data-act="hide" data-id="${x.id}" class="muted">${x.hidden?'숨김 해제':'숨기기'}</button><button data-act="del" data-id="${x.id}" class="danger">삭제</button></div><div class="meta">${x.date} · 저장 ${tm(x.updated||x.created)}</div>`;$('list').appendChild(d)}}
async function action(e){let fb=e.target.closest('button[data-file]');if(fb)return downloadAttachment(fb.dataset.file);let b=e.target.closest('button[data-act]');if(!b)return;let a=await load(),x=a.find(v=>v.id===b.dataset.id);if(!x)return;if(b.dataset.act==='edit'){$('date').value=x.date;$('title').value=x.title;$('content').value=x.content;editId=x.id;$('fileInfo').textContent=(x.attachments||[]).length?`기존 첨부 ${(x.attachments||[]).length}개 · 새 파일 추가 가능`:'';$('save').textContent='수정 저장';scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.act==='hide')x.hidden=!x.hidden;if(b.dataset.act==='del'){if(!confirm('이 일기를 삭제할까요?'))return;await dbDelByDiary(x.id);a=a.filter(v=>v.id!==x.id)}await store(a);await render()}
function dl(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function word(){let a=await load(),h='<html><meta charset="utf-8"><body><h1>나의 일기</h1>'+a.filter(x=>!x.hidden).sort((x,y)=>x.date.localeCompare(y.date)).map(x=>`<h2>${esc(x.date)} ${esc(x.title)}</h2><p>${esc(x.content).replace(/\n/g,'<br>')}</p><p>${x.date} · 저장 ${tm(x.updated||x.created)}</p>`).join('')+'</body></html>';dl(new Blob([h],{type:'application/msword'}),'나의_일기.doc')}async function excel(){let a=await load(),r=[['날짜','제목','내용','저장시간'],...a.filter(x=>!x.hidden).map(x=>[x.date,x.title,x.content,tm(x.updated||x.created)])],c='\ufeff'+r.map(z=>z.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');dl(new Blob([c],{type:'text/csv;charset=utf-8'}),'나의_일기.csv')}
async function snapshot(){let diaries=await load(),files=await dbAll();return {version:3,at:Date.now(),diaries,files}}async function browserBackup(){try{let sealed=await encryptObj(await snapshot());localStorage.setItem(BROWSER_BACKUP,sealed);$('backupMsg').innerHTML='<span class="ok">브라우저 백업 완료 · '+new Date().toLocaleString('ko-KR')+'</span>'}catch(e){$('backupMsg').innerHTML='<span class="err">브라우저 백업 실패</span>'}}
function loadSyncSettings(){try{let s=JSON.parse(localStorage.getItem(SYNC)||'{}');$('sbUrl').value=s.url||'';$('sbKey').value=s.key||'';$('syncCode').value=s.code||''}catch{}}function saveSyncSettings(){let s={url:$('sbUrl').value.trim().replace(/\/$/,''),key:$('sbKey').value.trim(),code:$('syncCode').value};localStorage.setItem(SYNC,JSON.stringify(s));$('syncMsg').textContent='동기화 설정을 저장했습니다.';return s}async function syncPath(code){let h=await sha('SYNC|'+code);return h.replace(/[+/=]/g,'').slice(0,48)+'.json'}
async function pushSync(){try{let s=saveSyncSettings();if(!s.url||!s.key||!s.code)throw Error('동기화 설정을 모두 입력하세요.');$('syncMsg').textContent='업로드 중...';let body=await encryptObj(await snapshot()),path=await syncPath(s.code),r=await fetch(`${s.url}/storage/v1/object/diary-sync/${path}`,{method:'POST',headers:{apikey:s.key,Authorization:`Bearer ${s.key}`,'Content-Type':'application/json','x-upsert':'true'},body});if(!r.ok)throw Error(await r.text());$('syncMsg').innerHTML='<span class="ok">클라우드 동기화 업로드 완료</span>'}catch(e){console.error(e);$('syncMsg').innerHTML='<span class="err">업로드 실패: '+esc(e.message||e)+'</span>'}}
async function pullSync(){try{let s=saveSyncSettings();if(!s.url||!s.key||!s.code)throw Error('동기화 설정을 모두 입력하세요.');if(!confirm('클라우드의 일기로 현재 기기 데이터를 교체할까요?'))return;$('syncMsg').textContent='다운로드 중...';let path=await syncPath(s.code),r=await fetch(`${s.url}/storage/v1/object/public/diary-sync/${path}`,{headers:{apikey:s.key}});if(!r.ok)throw Error(await r.text());let snap=await decryptObj(await r.text());if(!snap||snap.version!==3)throw Error('백업 형식이 맞지 않습니다.');await store(snap.diaries||[]);await dbClear();for(const f of snap.files||[])await dbPut(f);await render();$('syncMsg').innerHTML='<span class="ok">클라우드 동기화 다운로드 완료</span>'}catch(e){console.error(e);$('syncMsg').innerHTML='<span class="err">다운로드 실패: '+esc(e.message||e)+'</span>'}}
$('unlock').onclick=unlock;$('pw').onkeydown=e=>{if(e.key==='Enter')unlock()};$('save').onclick=save;$('q').oninput=render;$('searchDate').onchange=render;$('reset').onclick=()=>{$('q').value='';$('searchDate').value='';render()};$('toggleHidden').onclick=()=>{showHidden=!showHidden;render()};$('list').onclick=action;$('files').onchange=()=>{$('fileInfo').textContent=`새 첨부 ${$('files').files.length}개`};$('word').onclick=word;$('excel').onclick=excel;$('browserBackup').onclick=browserBackup;$('saveSync').onclick=saveSyncSettings;$('pushSync').onclick=pushSync;$('pullSync').onclick=pullSync;
</script></body></html>
