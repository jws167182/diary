<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>나의 일기</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#222;background:#f5f5f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px}.box,.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}h1{font-size:24px}h2{font-size:18px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:5px 0 10px}textarea{min-height:180px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}button{border:0;border-radius:9px;padding:10px 13px}.primary{background:#222;color:#fff}.muted{background:#eee}.danger{background:#fee;color:#900}.meta{font-size:12px;color:#777;text-align:right;margin-top:10px}.title{font-weight:700;font-size:17px}.body{white-space:pre-wrap;margin:9px 0;line-height:1.55}.actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.notice,.attach{font-size:13px;color:#666}.lock{max-width:420px;margin:70px auto}.empty{text-align:center;color:#888;padding:24px}</style></head><body>
<div id="lock" class="wrap lock"><div class="box"><h1>🔒 나의 일기</h1><p class="notice">처음이면 사용할 비밀번호를 입력하세요.</p><input id="pw" type="password" placeholder="비밀번호"><button id="unlock" class="primary" style="width:100%">열기</button></div></div>
<div id="app" class="wrap hidden"><h1>📔 나의 일기</h1><div class="box"><div class="row"><input id="date" type="date"><input id="title" placeholder="제목"></div><textarea id="content" placeholder="오늘의 기록"></textarea><input id="files" type="file" multiple><div id="fileInfo" class="notice"></div><button id="save" class="primary" style="width:100%;margin-top:8px">일기 저장</button></div>
<div class="box"><h2>검색</h2><div class="row"><input id="q" placeholder="제목/내용 검색"><input id="searchDate" type="date"></div><div class="row"><button id="reset" class="muted">검색 초기화</button><button id="toggleHidden" class="muted">숨긴 일기 보기</button></div><div id="count" class="notice"></div></div>
<div class="box"><h2>백업</h2><div class="row"><button id="word" class="muted">Word 백업</button><button id="excel" class="muted">Excel 백업</button></div></div><h2 id="listTitle">전체 일기</h2><div id="list"></div></div>
<script>
const DATA='diary_clean_v2',AUTH='diary_clean_auth_v2',ADB='diary_attachments_v1';let password='',showHidden=false,editId=null;
const $=x=>document.getElementById(x),enc=new TextEncoder(),dec=new TextDecoder();const b64=u=>btoa(String.fromCharCode(...u)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hash(s){return b64(new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s))))}async function keyFor(p,s){let k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function encrypt(o){let s=crypto.getRandomValues(new Uint8Array(16)),i=crypto.getRandomValues(new Uint8Array(12)),k=await keyFor(password,s),d=await crypto.subtle.encrypt({name:'AES-GCM',iv:i},k,enc.encode(JSON.stringify(o)));return JSON.stringify({s:b64(s),i:b64(i),d:b64(new Uint8Array(d))})}async function decrypt(r){if(!r)return[];let o=JSON.parse(r),s=unb64(o.s),i=unb64(o.i),k=await keyFor(password,s),p=await crypto.subtle.decrypt({name:'AES-GCM',iv:i},k,unb64(o.d));return JSON.parse(dec.decode(p))}const load=()=>decrypt(localStorage.getItem(DATA));async function store(a){localStorage.setItem(DATA,await encrypt(a))}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(ADB,1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function dbPut(v){let db=await openDB();return new Promise((ok,no)=>{let t=db.transaction('files','readwrite');t.objectStore('files').put(v);t.oncomplete=()=>{db.close();ok()};t.onerror=()=>{let e=t.error;db.close();no(e)};t.onabort=()=>{let e=t.error||new Error('첨부 저장 중단');db.close();no(e)}})}async function dbGet(id){let db=await openDB();return new Promise((ok,no)=>{let r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function dbDelByDiary(diaryId){let db=await openDB();return new Promise((ok,no)=>{let t=db.transaction('files','readwrite'),s=t.objectStore('files'),r=s.openCursor();r.onsuccess=e=>{let c=e.target.result;if(!c)return;c.value.diaryId===diaryId?c.delete():0;c.continue()};t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function tm(t){let d=new Date(t);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function unlock(){let p=$('pw').value;if(!p)return alert('비밀번호를 입력하세요.');let a=localStorage.getItem(AUTH),h=await hash('DIARY|'+p);if(!a){localStorage.setItem(AUTH,h);password=p;await store([])}else if(a!==h)return alert('비밀번호가 틀렸습니다.');else password=p;try{await load()}catch{return alert('저장 데이터를 열 수 없습니다.')} $('lock').classList.add('hidden');$('app').classList.remove('hidden');$('date').value=today();render()}
async function addFiles(diaryId){let refs=[];for(const f of Array.from($('files').files||[])){let id=crypto.randomUUID();let buf=await f.arrayBuffer();await dbPut({id,diaryId,name:f.name,type:f.type||'application/octet-stream',data:buf,size:f.size});refs.push({id,name:f.name,type:f.type||'',size:f.size})}return refs}
async function save(){try{let date=$('date').value,title=$('title').value.trim(),content=$('content').value.trim();if(!date||(!title&&!content))return alert('날짜와 일기 내용을 입력하세요.');let a=await load(),now=Date.now();if(editId){let i=a.findIndex(x=>x.id===editId);if(i<0)return alert('수정할 일기를 찾지 못했습니다.');if(a[i].date!==today())return alert('지난 날짜의 일기는 수정할 수 없습니다.');let refs=await addFiles(editId);a[i]={...a[i],date,title,content,updated:now,attachments:[...(a[i].attachments||[]),...refs]}}else{if(a.some(x=>x.date===date))return alert('해당 날짜에 이미 저장된 일기가 있습니다.');let id=crypto.randomUUID(),refs=await addFiles(id);a.unshift({id,date,title,content,created:now,updated:now,hidden:false,attachments:refs})}await store(a);clearForm();await render()}catch(e){console.error(e);alert('저장 중 오류가 발생했습니다. 첨부파일 또는 브라우저 저장공간을 확인하세요.')}}
function clearForm(){$('date').value=today();$('title').value='';$('content').value='';$('files').value='';$('fileInfo').textContent='';editId=null;$('save').textContent='일기 저장'}
async function downloadAttachment(id,name){let f=await dbGet(id);if(!f)return alert('첨부파일을 찾을 수 없습니다.');let blob=f.blob instanceof Blob?f.blob:new Blob([f.data],{type:f.type||'application/octet-stream'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name||f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function render(){let a=await load(),q=$('q').value.trim().toLowerCase(),sd=$('searchDate').value;a=a.filter(x=>showHidden?x.hidden:!x.hidden).filter(x=>(!q||(x.title+' '+x.content).toLowerCase().includes(q))&&(!sd||x.date===sd)).sort((x,y)=>y.date.localeCompare(x.date));$('count').textContent=`${a.length}개의 일기`;$('listTitle').textContent=showHidden?'숨긴 일기':'전체 일기';$('toggleHidden').textContent=showHidden?'전체 일기 보기':'숨긴 일기 보기';$('list').innerHTML=a.length?'':'<div class="box empty">저장된 일기가 없습니다.</div>';for(const x of a){let d=document.createElement('div');d.className='card';let ats=(x.attachments||[]).map(f=>`<div class="attach"><button class="muted" data-file="${f.id}" data-name="${encodeURIComponent(f.name)}">📎 ${esc(f.name)}</button></div>`).join('');d.innerHTML=`<div class="title">${esc(x.title||'(제목 없음)')}</div><div class="body">${esc(x.content)}</div>${ats}<div class="actions">${x.date===today()?`<button data-act="edit" data-id="${x.id}" class="muted">수정</button>`:''}<button data-act="hide" data-id="${x.id}" class="muted">${x.hidden?'숨김 해제':'숨기기'}</button><button data-act="del" data-id="${x.id}" class="danger">삭제</button></div><div class="meta">${x.date} · 저장 ${tm(x.updated||x.created)}</div>`;$('list').appendChild(d)}}
async function action(e){let fb=e.target.closest('button[data-file]');if(fb)return downloadAttachment(fb.dataset.file,decodeURIComponent(fb.dataset.name));let b=e.target.closest('button[data-act]');if(!b)return;let a=await load(),x=a.find(v=>v.id===b.dataset.id);if(!x)return;if(b.dataset.act==='edit'){$('date').value=x.date;$('title').value=x.title;$('content').value=x.content;editId=x.id;$('fileInfo').textContent=(x.attachments||[]).length?`기존 첨부 ${(x.attachments||[]).length}개 · 새 파일을 추가할 수 있습니다.`:'';$('save').textContent='수정 저장';scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.act==='hide')x.hidden=!x.hidden;if(b.dataset.act==='del'){if(!confirm('이 일기를 삭제할까요?'))return;await dbDelByDiary(x.id);a=a.filter(v=>v.id!==x.id)}await store(a);render()}
function dl(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function word(){let a=await load(),h='<html><meta charset="utf-8"><body><h1>나의 일기</h1>'+a.filter(x=>!x.hidden).sort((x,y)=>x.date.localeCompare(y.date)).map(x=>`<h2>${esc(x.date)} ${esc(x.title)}</h2><p>${esc(x.content).replace(/\n/g,'<br>')}</p><p>${x.date} · 저장 ${tm(x.updated||x.created)}</p>`).join('')+'</body></html>';dl(new Blob([h],{type:'application/msword'}),'나의_일기.doc')}async function excel(){let a=await load(),r=[['날짜','제목','내용','저장시간'],...a.filter(x=>!x.hidden).map(x=>[x.date,x.title,x.content,tm(x.updated||x.created)])],c='\ufeff'+r.map(z=>z.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');dl(new Blob([c],{type:'text/csv;charset=utf-8'}),'나의_일기.csv')}
$('unlock').onclick=unlock;$('pw').onkeydown=e=>{if(e.key==='Enter')unlock()};$('save').onclick=save;$('q').oninput=render;$('searchDate').onchange=render;$('reset').onclick=()=>{$('q').value='';$('searchDate').value='';render()};$('toggleHidden').onclick=()=>{showHidden=!showHidden;render()};$('list').onclick=action;$('files').onchange=()=>{$('fileInfo').textContent=`새 첨부 ${$('files').files.length}개`};$('word').onclick=word;$('excel').onclick=excel;
</script></body></html>
